name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis: shellcheck every shell script. The `error` severity gate
  # is a hard failure (the repo is clean at this level today). Warnings are
  # reported separately and do not fail the build, so they can be cleaned up
  # incrementally without blocking merges.
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Collect shell scripts
        id: collect
        run: |
          # ell and the launcher have no .sh extension; include them explicitly.
          files="$(git ls-files '*.sh' 'ell' | tr '\n' ' ')"
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Scripts to check: ${files}"

      - name: ShellCheck (errors, blocking)
        run: shellcheck -S error ${{ steps.collect.outputs.files }}

      - name: ShellCheck (warnings, non-blocking)
        continue-on-error: true
        run: shellcheck -S warning ${{ steps.collect.outputs.files }}

  # Run the full test suite across the oldest and current supported bash
  # versions using the project's own containerised entry point.
  tests:
    name: Tests (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: [ "4.1", "5.2" ]
    container:
      image: bash:${{ matrix.bash }}
    steps:
      - uses: actions/checkout@v4

      # entry.sh derives all paths from its own location and best-effort installs
      # curl and a global launcher, so no extra setup is needed here.
      - name: Run test suite
        run: bash tests/entry.sh

  # Run the suite with mawk as `awk`. Debian/Ubuntu default to mawk (not the
  # gawk/busybox awk the container jobs use), and render_to_text.awk is written
  # to be portable across awk implementations -- this actually exercises that.
  tests-mawk:
    name: Tests (mawk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mawk and make it the default awk
        run: |
          sudo apt-get update && sudo apt-get install -y mawk
          # Point /usr/bin/awk at mawk for this run.
          sudo update-alternatives --set awk /usr/bin/mawk
          awk -W version 2>&1 | head -1 || awk --version 2>&1 | head -1 || true

      - name: Run test suite
        run: bash tests/entry.sh

  # Run the suite on macOS to exercise the BSD toolchain (BSD awk/sed/stat/
  # mktemp, macOS curl) the code is written to support. macOS ships bash 3.2,
  # which ell rejects, so install a supported bash; GNU `timeout` is absent on
  # BSD, so provide it from coreutils (as gtimeout) for the test harness.
  tests-macos:
    name: Tests (macOS / BSD tools)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bash and coreutils (for timeout)
        run: |
          brew install bash coreutils
          # Expose gtimeout as `timeout` for the test harness, on PATH ahead of
          # anything else. The suite otherwise uses the system BSD tools.
          mkdir -p "${HOME}/bin"
          ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "${HOME}/bin/timeout"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          # Put the newer bash ahead of the system 3.2.
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"

      - name: Show tool versions
        run: |
          bash --version | head -1
          command -v timeout && timeout --version | head -1
          awk --version 2>/dev/null | head -1 || echo "awk: BSD (no --version)"

      - name: Run test suite
        run: bash tests/entry.sh
